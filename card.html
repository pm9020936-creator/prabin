<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Digital Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="card-container">
        <div class="card-header"></div>
        <div class="profile-section">
            <div class="avatar-container">
                <img src="https://unsplash.com" alt="Profile Photo" class="profile-avatar">
            </div>
            <h1 class="profile-name">prabin magar</h1>
            <p class="profile-title">head of engineering</p>
            <p class="profile-company"><i class="fa-solid fa-building">innovacation of aircraft</i> </p>
        </div>
        <div class="contact-grid">
            <a href="mailto:alex.morgan@example.com" class="contact-item">
                <div class="icon-wrapper"><i class="fa-solid fa-envelope"></i></div>
                <span>Email</span>
            </a>
            <a href="tel:+1234567890" class="contact-item">
                <div class="icon-wrapper"><i class="fa-solid fa-phone"></i></div>
                <span>Call</span>
            </a>
            <a href="https://example.com" target="_blank" class="contact-item">
                <div class="icon-wrapper"><i class="fa-solid fa-globe"></i></div>
                <span>Website</span>
            </a>
        </div>
        <div class="bio-section">
            <p>building various part of aircraft like fuselage,wings and engines.</p>
        </div>

        <div class="divider"></div>
        <div class="links-section">
            <a href="https://linkedin.com" target="_blank" class="action-link">
                <i class="fa-brands fa-linkedin-in brand-icon"></i>
                <span class="link-text">Connect on LinkedIn</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="action-link">
                <i class="fa-brands fa-instagram brand-icon"></i>
                <span class="link-text">Follow on Instagram</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
            <a href="https://twitter.com" target="_blank" class="action-link">
                <i class="fa-brands fa-x-twitter brand-icon"></i>
                <span class="link-text">Follow on X</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>
        <div class="card-footer">
            <button class="save-btn"><i class="fa-solid fa-user-plus"></i> Save Contact</button>
        </div>
    </div>
</body>
</html>
